worker_processes auto;

events { worker_connections 1024; }

http {
  # --- Opcional: Rate limiting por IP (100 req/min) ---
  #limit_req_zone $binary_remote_addr zone=perip:10m rate=100r/m;

  # logs básicos
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  keepalive_timeout 65;

  # upstreams: resolvibles por nombre de servicio en la red de compose
  upstream users_upstream {
    server users-svc:4001;
    keepalive 16;
  }

  upstream orders_upstream {
    server orders-svc:4002;
    keepalive 16;
  }

  server {
    listen 80;

    # --- CORS básico (ajusta Access-Control-Allow-Origin) ---
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-Id" always;
    add_header Access-Control-Expose-Headers "X-Request-Id" always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    # --- Health del gateway ---
    location = /health {
      return 200 'OK';
      add_header Content-Type text/plain;
    }

    # --- /users -> users-svc (sin prefijo) ---
    location /users/ {
      #limit_req zone=perip burst=50 nodelay;  # (descomenta para rate limit)
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;

      proxy_connect_timeout 3s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;

      # Al usar "/" al final, Nginx reemplaza /users/ por / en el upstream
      proxy_pass http://users_upstream/;
    }

    # --- /orders -> orders-svc (sin prefijo) ---
    location /orders/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;

      proxy_connect_timeout 3s;
      proxy_send_timeout 15s;
      proxy_read_timeout 30s;

      proxy_pass http://orders_upstream/;
    }

    # fallback opcional
    location / {
      return 404 'Not Found\n';
      add_header Content-Type text/plain;
    }
  }
}
