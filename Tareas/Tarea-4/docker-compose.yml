services:
  mongo:
    image: mongo:7
    container_name: sales-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: sales-api
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/sales_db
    ports:
      - "3000:3000"
    depends_on:
      - mongo

volumes:
  mongo_data:
