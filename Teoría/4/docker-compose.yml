services:
  api-gateway:
    image: nginx:alpine
    depends_on:
      - products-svc
      - customers-svc
    ports: [ "8080:80" ]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro

  products-svc:
    build: ./products-svc
    image: products-svc:exam
    environment:
      PORT: 4001
    expose: [ "4001" ]
    # opcional durante dev:
    ports: [ "4001:4001" ]

  customers-svc:
    build: ./customers-svc
    image: customers-svc:exam
    environment:
      PORT: 5000
    expose: [ "5000" ]
    # opcional durante dev:
    ports: [ "5000:5000" ]
