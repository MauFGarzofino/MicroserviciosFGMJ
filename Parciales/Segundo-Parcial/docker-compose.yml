services:
  # BD
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-prootpass" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ backend ]

  mongo:
    image: mongo:6
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ backend ]
    #


    # Servicios
  auth-svc:
    build: ./auth-svc
    container_name: auth-svc
    depends_on:
      mysql:
        condition: service_healthy
    networks: [ backend ]

  vehiculos-svc:
    build: ./vehiculos-svc
    container_name: vehiculos-svc
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./shared/vehiculo.proto:/app/shared/vehiculo.proto:ro
    networks: [ backend ]

  notificaciones-svc:
    build: ./notificaciones-svc
    container_name: notificaciones-svc
    environment:
      JWT_SECRET: jwt_secret
    networks: [ backend ]

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - auth-svc
      - vehiculos-svc
      - notificaciones-svc
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [ backend ]

networks:
  backend:


volumes:
  mysql_data:
  mongo_data:
