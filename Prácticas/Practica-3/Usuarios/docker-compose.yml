version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: users-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build: .
    container_name: users-app
    env_file: .env
    ports:
      - "3000:3000"
    command: npm start

volumes:
  db_data:
