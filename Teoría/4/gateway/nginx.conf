worker_processes auto;

events { worker_connections 1024; }

http {
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  keepalive_timeout 65;

  upstream products_upstream { server products-svc:4001; keepalive 16; }
  upstream customers_upstream { server customers-svc:5000; keepalive 16; }

  server {
    listen 80;

    # CORS básico (ajusta en prod)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-Id" always;
    add_header Access-Control-Expose-Headers "X-Request-Id" always;
    if ($request_method = OPTIONS) { return 204; }

    # Health del gateway
    location = /health { return 200 'OK'; add_header Content-Type text/plain; }

    # /products -> products-svc
    location /products/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_connect_timeout 3s; proxy_send_timeout 10s; proxy_read_timeout 10s;
      proxy_pass http://products_upstream/;
    }

    # /customers -> customers-svc
    location /customers/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_connect_timeout 3s; proxy_send_timeout 10s; proxy_read_timeout 10s;
      proxy_pass http://customers_upstream/;
    }

    location / { return 404 'Not Found\n'; add_header Content-Type text/plain; }
  }
}
