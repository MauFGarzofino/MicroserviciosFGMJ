worker_processes 1;
events { worker_connections 1024; }

http {
  sendfile on;
  include       mime.types;
  default_type  application/octet-stream;

  upstream auth_upstream            { server auth-svc:3001; }
  upstream vehiculos_upstream       { server vehiculos-svc:3002; }
  upstream notificaciones_upstream  { server notificaciones-svc:3003; }

  server {
    listen 80;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-Id" always;
    add_header Access-Control-Expose-Headers "X-Request-Id" always;

    location = / {
      add_header Content-Type text/plain;
      return 200 "API Gateway corriendo";
    }

    location /auth/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;

      proxy_connect_timeout 3s;
      proxy_send_timeout 15s;
      proxy_read_timeout 30s;

      proxy_pass http://auth_upstream/; 
    }

    # Vehiculos (REST + Swagger)
    location /vehiculos/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://vehiculos_upstream;
    }

    location /docs/ {
      proxy_set_header Host $host;
      proxy_pass http://vehiculos_upstream;
    }

    location /notificaciones/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://notificaciones_upstream/;
    }
  }
}
